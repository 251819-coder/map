<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎭 공연 지도</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0c1a;
      --panel-bg: #1a1528;
      --panel-bg2: #211c33;
      --accent: #c084fc;
      --accent2: #a855f7;
      --accent-glow: rgba(192,132,252,0.18);
      --gold: #fbbf24;
      --text: #f3f0ff;
      --text-muted: #9ca3b0;
      --border: rgba(192,132,252,0.15);
      --hover: rgba(192,132,252,0.08);
      --radius: 14px;
      --shadow: 0 4px 32px rgba(0,0,0,0.5);
    }

    body {
      display: flex;
      height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      overflow: hidden;
      color: var(--text);
    }

    /* ── LEFT PANEL ── */
    #left-panel {
      width: 360px;
      min-width: 320px;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 10;
      position: relative;
    }

    /* Header */
    #header {
      padding: 18px 18px 14px;
      background: linear-gradient(135deg, #1a1528 0%, #2d1f4e 100%);
      border-bottom: 1px solid var(--border);
    }
    #header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    #header-title span { font-size: 22px; }

    #search-wrap { position: relative; }
    #search-box {
      width: 100%;
      padding: 10px 42px 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: rgba(255,255,255,0.05);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    #search-box::placeholder { color: var(--text-muted); }
    #search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); background: rgba(255,255,255,0.08); }
    #search-btn {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--accent); display: flex; align-items: center;
    }
    #search-btn svg { width: 17px; height: 17px; }

    #suggestions {
      position: absolute;
      top: calc(100% + 4px); left: 0; right: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-bg2);
      max-height: 160px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none;
    }
    #suggestions div {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: background .15s;
      border-bottom: 1px solid var(--border);
    }
    #suggestions div:last-child { border-bottom: none; }
    #suggestions div:hover { background: var(--hover); color: var(--accent); }

    /* Tabs */
    .tabs {
      display: flex;
      padding: 12px 14px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-bg);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      background: transparent;
      transition: all .2s;
      white-space: nowrap;
    }
    .tab:hover { border-color: var(--accent); color: var(--accent); }
    .tab.active { background: var(--accent2); border-color: var(--accent2); color: #fff; box-shadow: 0 0 16px var(--accent-glow); }

    /* Results */
    #results-area {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #results { list-style: none; }
    #results li {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background .15s;
    }
    #results li:hover { background: var(--hover); }
    #results li.selected { background: var(--hover); border-left: 3px solid var(--accent); }

    .place-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: rgba(192,132,252,0.12);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .place-info { flex: 1; min-width: 0; }
    .place-name {
      font-size: 14px; font-weight: 600;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .place-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .place-hint { font-size: 11px; color: var(--accent); margin-top: 2px; }

    .fav-btn {
      background: none; border: none;
      cursor: pointer; font-size: 16px;
      flex-shrink: 0; opacity: .4;
      transition: opacity .2s, transform .2s;
      padding: 4px;
    }
    .fav-btn:hover { opacity: 1; transform: scale(1.2); }
    .fav-btn.active { opacity: 1; }

    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .empty-state .emoji { font-size: 36px; margin-bottom: 10px; }

    /* ── DETAIL PANEL ── */
    #detail-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--panel-bg);
      border-top: 2px solid var(--accent2);
      border-radius: var(--radius) var(--radius) 0 0;
      transform: translateY(100%);
      transition: transform .38s cubic-bezier(.4,0,.2,1);
      z-index: 30;
      max-height: 82%;
      overflow-y: auto;
      box-shadow: 0 -12px 48px rgba(168,85,247,0.18);
    }
    #detail-panel.open { transform: translateY(0); }

    #detail-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: var(--panel-bg);
      z-index: 1;
    }
    #detail-header-left { display: flex; flex-direction: column; gap: 4px; }
    #detail-title { font-size: 16px; font-weight: 700; color: var(--accent); }
    #detail-subtitle { font-size: 11px; color: var(--text-muted); }
    #detail-close {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 22px; line-height: 1;
      padding: 2px 6px; border-radius: 6px;
      transition: background .15s, color .15s;
    }
    #detail-close:hover { background: var(--hover); color: var(--text); }

    #detail-body { padding: 14px 16px 20px; }

    /* Theater info rows */
    .detail-row {
      display: flex; align-items: flex-start;
      gap: 10px; margin-bottom: 11px; font-size: 13px;
    }
    .detail-row-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .detail-row-text { color: var(--text-muted); line-height: 1.5; }
    .detail-row-text a { color: var(--accent); text-decoration: none; }
    .detail-row-text a:hover { text-decoration: underline; }

    /* Performance section */
    #perf-section { margin-top: 18px; }
    #perf-section-title {
      font-size: 13px; font-weight: 700; color: var(--text-muted);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    #perf-loading {
      text-align: center; padding: 24px 0;
      color: var(--text-muted); font-size: 13px;
    }
    .spin {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Performance cards */
    .perf-card {
      background: var(--panel-bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      transition: border-color .2s;
    }
    .perf-card:hover { border-color: var(--accent); }

    .perf-title {
      font-size: 15px; font-weight: 700; color: var(--text);
      margin-bottom: 8px; line-height: 1.3;
    }
    .perf-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .perf-tag {
      padding: 2px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 500;
      background: rgba(192,132,252,0.12);
      color: var(--accent);
      border: 1px solid rgba(192,132,252,0.25);
    }
    .perf-tag.genre { background: rgba(251,191,36,0.1); color: var(--gold); border-color: rgba(251,191,36,0.25); }
    .perf-meta-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .perf-meta-item {
      background: rgba(255,255,255,0.03);
      border-radius: 8px; padding: 8px 10px;
    }
    .perf-meta-label { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
    .perf-meta-value { font-size: 12px; font-weight: 600; color: var(--text); }
    .perf-meta-value.price { color: var(--gold); }

    /* Nearby food tab detail */
    #food-section { margin-top: 4px; }
    .food-card {
      background: var(--panel-bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      transition: border-color .2s;
    }
    .food-card:hover { border-color: var(--accent); }
    .food-card-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: rgba(192,132,252,0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .food-card-info { flex: 1; min-width: 0; }
    .food-card-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .food-card-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .food-card-dist { font-size: 11px; color: var(--accent); flex-shrink: 0; }

    #map { flex: 1; }
  </style>
</head>
<body>
<div id="left-panel">

  <!-- Header -->
  <div id="header">
    <div id="header-title"><span>🎭</span> 공연 지도</div>
    <div id="search-wrap">
      <input type="text" id="search-box" placeholder="극장 이름으로 검색…">
      <button id="search-btn" title="검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <div id="suggestions"></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-type="theater">🎭 극장</div>
    <div class="tab" data-type="food">🍽 주변 맛집</div>
    <div class="tab" data-type="cafe">☕ 주변 카페</div>
  </div>

  <!-- Results -->
  <div id="results-area">
    <ul id="results"></ul>
  </div>

  <!-- Detail Panel -->
  <div id="detail-panel">
    <div id="detail-header">
      <div id="detail-header-left">
        <div id="detail-title"></div>
        <div id="detail-subtitle"></div>
      </div>
      <button id="detail-close">×</button>
    </div>
    <div id="detail-body">
      <div id="detail-content"></div>

      <!-- Theater tab: performance info -->
      <div id="perf-section" style="display:none;">
        <div id="perf-section-title">🎬 현재 공연 중</div>
        <div id="perf-loading" style="display:none;"><span class="spin"></span> 공연 정보 불러오는 중…</div>
        <div id="perf-list"></div>
      </div>

      <!-- Food tab: nearby places -->
      <div id="food-section" style="display:none;">
        <div id="perf-section-title" style="margin-top:0;">📍 극장 주변</div>
        <div id="food-list"></div>
      </div>
    </div>
  </div>
</div>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5bf7c0ceaa203771db8251bd28f75cac&libraries=services"></script>
<script>
// ═══════════════════════════════════════════
//  MAP INIT
// ═══════════════════════════════════════════
var mapContainer = document.getElementById('map');
var map = new kakao.maps.Map(mapContainer, {
  center: new kakao.maps.LatLng(37.566826, 126.978656),
  level: 5
});
var ps = new kakao.maps.services.Places();

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
var currentPosition = null;
var selectedMarker   = null;
var selectedIW       = null;
var nearbyMarkers    = [];
var favorites        = new Map();
var activeType       = 'theater';
var selectedPlace    = null;
var clickTimer       = null;
var selectedPlaceId  = null;

// ═══════════════════════════════════════════
//  MARKER IMAGES
// ═══════════════════════════════════════════
function makeSVGUrl(svg) {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// 선택 마커: 보라 핀
var selSVG = [
  '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44">',
  '<defs><filter id="ds"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.45"/></filter></defs>',
  '<g filter="url(#ds)">',
  '<path d="M17 2C9.82 2 4 7.82 4 15c0 10 13 27 13 27S30 25 30 15C30 7.82 24.18 2 17 2z" fill="#a855f7"/>',
  '<circle cx="17" cy="15" r="7" fill="#fff"/>',
  '<text x="17" y="19" text-anchor="middle" font-size="10" fill="#a855f7">🎭</text>',
  '</g></svg>'
].join('');
var selectedMarkerImage = new kakao.maps.MarkerImage(
  makeSVGUrl(selSVG),
  new kakao.maps.Size(34, 44),
  { offset: new kakao.maps.Point(17, 44) }
);

// 목록 마커: 작은 보라 동그라미
var dotSVG = [
  '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">',
  '<circle cx="7" cy="7" r="6" fill="#c084fc" stroke="#fff" stroke-width="2"/>',
  '</svg>'
].join('');
var nearbyMarkerImage = new kakao.maps.MarkerImage(
  makeSVGUrl(dotSVG),
  new kakao.maps.Size(14, 14),
  { offset: new kakao.maps.Point(7, 7) }
);

// 음식/카페 마커: 작은 골드 동그라미
var foodDotSVG = [
  '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">',
  '<circle cx="7" cy="7" r="6" fill="#fbbf24" stroke="#fff" stroke-width="2"/>',
  '</svg>'
].join('');
var foodMarkerImage = new kakao.maps.MarkerImage(
  makeSVGUrl(foodDotSVG),
  new kakao.maps.Size(14, 14),
  { offset: new kakao.maps.Point(7, 7) }
);

// ═══════════════════════════════════════════
//  MARKER HELPERS
// ═══════════════════════════════════════════
function clearSelectedMarker() {
  if (selectedMarker) { selectedMarker.setMap(null); selectedMarker = null; }
  if (selectedIW)     { selectedIW.close();           selectedIW = null;     }
}
function clearNearbyMarkers() {
  nearbyMarkers.forEach(function(m) { m.setMap(null); });
  nearbyMarkers = [];
}
function clearAllMarkers() { clearSelectedMarker(); clearNearbyMarkers(); }

function addNearbyMarker(place, isFood) {
  var coords = new kakao.maps.LatLng(place.y, place.x);
  var marker = new kakao.maps.Marker({
    position: coords,
    map: map,
    image: isFood ? foodMarkerImage : nearbyMarkerImage
  });
  nearbyMarkers.push(marker);
  kakao.maps.event.addListener(marker, 'click', function() { handlePlaceSelect(place); });
  return marker;
}

// ═══════════════════════════════════════════
//  GEOLOCATION
// ═══════════════════════════════════════════
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(function(pos) {
    currentPosition = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
    map.setCenter(currentPosition);
    // 내 위치 마커
    var mySVG = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#a855f7" opacity="0.18"/><circle cx="10" cy="10" r="5.5" fill="#a855f7" stroke="#fff" stroke-width="2"/></svg>';
    new kakao.maps.Marker({
      position: currentPosition, map: map,
      image: new kakao.maps.MarkerImage(makeSVGUrl(mySVG), new kakao.maps.Size(20,20), { offset: new kakao.maps.Point(10,10) })
    });
    loadTab('theater');
  }, function() { loadTab('theater'); });
} else {
  loadTab('theater');
}

// ═══════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════
var searchBox   = document.getElementById('search-box');
var suggestions = document.getElementById('suggestions');

var suggestTimer = null;

searchBox.addEventListener('input', function() {
  var kw = searchBox.value.trim();
  if (!kw) { suggestions.style.display = 'none'; return; }

  // 300ms 디바운스
  clearTimeout(suggestTimer);
  suggestTimer = setTimeout(function() {
    // 1차: 입력 그대로 검색
    ps.keywordSearch(kw, function(data, status) {
      var results = (status === kakao.maps.services.Status.OK) ? data : [];

      // 결과가 없으면 서울 중심으로 재검색
      if (results.length === 0) {
        ps.keywordSearch(kw, function(d2, s2) {
          showSuggestions((s2 === kakao.maps.services.Status.OK) ? d2 : []);
        }, { location: new kakao.maps.LatLng(37.5665, 126.9780), radius: 20000 });
      } else {
        showSuggestions(results);
      }
    }, currentPosition ? { location: currentPosition, radius: 20000 } : {});
  }, 200);
});

function showSuggestions(data) {
  suggestions.innerHTML = '';
  if (!data || data.length === 0) { suggestions.style.display = 'none'; return; }
  data.slice(0, 6).forEach(function(p) {
    var d = document.createElement('div');
    // 이름 + 카테고리 힌트
    var cat = p.category_group_name || (p.category_name ? p.category_name.split('>').pop().trim() : '');
    d.innerHTML = '<span style="font-weight:500">' + p.place_name + '</span>' +
      (cat ? '<span style="color:var(--text-muted);font-size:11px;margin-left:6px;">' + cat + '</span>' : '');
    d.onclick = function() {
      searchBox.value = p.place_name;
      suggestions.style.display = 'none';
      searchByKeyword(p.place_name);
    };
    suggestions.appendChild(d);
  });
  suggestions.style.display = 'block';
}

searchBox.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { suggestions.style.display = 'none'; searchByKeyword(searchBox.value.trim()); }
  if (e.key === 'Escape') { suggestions.style.display = 'none'; }
});
document.getElementById('search-btn').addEventListener('click', function() {
  suggestions.style.display = 'none';
  searchByKeyword(searchBox.value.trim());
});
document.addEventListener('click', function(e) {
  if (!e.target.closest('#search-wrap')) suggestions.style.display = 'none';
});

function searchByKeyword(kw) {
  if (!kw) return;
  clearAllMarkers();
  document.getElementById('results').innerHTML =
    '<div class="empty-state"><div class="emoji">🔍</div>검색 중…</div>';

  var opts = currentPosition
    ? { location: currentPosition, radius: 20000 }
    : { location: new kakao.maps.LatLng(37.5665, 126.9780), radius: 30000 };

  ps.keywordSearch(kw, function(data, status) {
    if (status === kakao.maps.services.Status.OK && data.length > 0) {
      displayTheaters(data);
    } else {
      // 위치 제한 없이 재시도
      ps.keywordSearch(kw, function(d2, s2) {
        displayTheaters(s2 === kakao.maps.services.Status.OK ? d2 : []);
      });
    }
  }, opts);
}

// ═══════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    activeType = tab.getAttribute('data-type');
    closeDetail();
    clearAllMarkers();
    loadTab(activeType);
  });
});

function loadTab(type) {
  activeType = type;
  if (type === 'theater') {
    searchTheaters();
  } else if (type === 'food') {
    if (selectedPlace) {
      loadNearbyFood(selectedPlace, 'FD6');
    } else {
      showNearbyInstruction('식당');
    }
  } else if (type === 'cafe') {
    if (selectedPlace) {
      loadNearbyFood(selectedPlace, 'CE7');
    } else {
      showNearbyInstruction('카페');
    }
  }
}

function showNearbyInstruction(label) {
  clearNearbyMarkers();
  document.getElementById('results').innerHTML =
    '<div class="empty-state"><div class="emoji">🎭</div>극장 탭에서 극장을 먼저 선택하면<br>주변 ' + label + '을 보여드려요!</div>';
}

// ═══════════════════════════════════════════
//  THEATER SEARCH  (CT1 = 문화시설, AT4 = 관광명소 포함 키워드)
// ═══════════════════════════════════════════
var THEATER_KEYWORDS = [
  '세종문화회관', '충무아트센터', '예술의전당', '국립극장',
  '링크아트센터', 'LG아트센터', '블루스퀘어',
  '홍익대학교대학로아트센터', '대학로예술극장', '명동예술극장',
  'KBS아트홀', '국립정동극장', '두산아트센터', '아르코예술극장',
  '디큐브아트센터', '샤롯데씨어터', '드림아트센터', '더굿씨어터'
];

function searchTheaters() {
  var list = document.getElementById('results');
  list.innerHTML = '<div class="empty-state"><div class="emoji">🎭</div>극장 목록 불러오는 중…</div>';
  clearNearbyMarkers();

  var center = currentPosition || new kakao.maps.LatLng(37.5665, 126.9780);
  var allPlaces = [];
  var idSet = new Set();
  var done = 0;
  var total = THEATER_KEYWORDS.length;

  // 모든 키워드를 병렬로 검색 — 위치 제한 없이 서울 전역
  THEATER_KEYWORDS.forEach(function(kw) {
    ps.keywordSearch(kw, function(data, status) {
      done++;
      if (status === kakao.maps.services.Status.OK) {
        data.slice(0, 2).forEach(function(p) {
          if (!idSet.has(p.id)) {
            idSet.add(p.id);
            allPlaces.push(p);
          }
        });
      }
      if (done === total) {
        // 현재 위치 기준 거리순 정렬
        allPlaces.sort(function(a, b) {
          return parseFloat(haversine(center.getLat(), center.getLng(), a.y, a.x))
               - parseFloat(haversine(center.getLat(), center.getLng(), b.y, b.x));
        });
        displayTheaters(allPlaces.length > 0 ? allPlaces : []);
      }
    }, { location: new kakao.maps.LatLng(37.5665, 126.9780), radius: 50000 });
  });
}

function displayTheaters(places) {
  clearNearbyMarkers();
  var list = document.getElementById('results');
  list.innerHTML = '';

  if (!places || places.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">🎭</div>근처 극장을 찾지 못했어요<br><small>검색창에서 극장 이름을 검색해보세요</small></div>';
    return;
  }

  if (places.length > 1) {
    var bounds = new kakao.maps.LatLngBounds();
    places.forEach(function(p) { bounds.extend(new kakao.maps.LatLng(p.y, p.x)); });
    map.setBounds(bounds);
  }

  places.forEach(function(place) {
    addNearbyMarker(place, false);

    var li = document.createElement('li');
    li.dataset.id = place.id;

    var icon = document.createElement('div');
    icon.className = 'place-icon';
    icon.textContent = '🎭';

    var info = document.createElement('div');
    info.className = 'place-info';

    var name = document.createElement('div');
    name.className = 'place-name';
    name.textContent = place.place_name;

    var meta = document.createElement('div');
    meta.className = 'place-meta';
    var dist = calcDistance(place);
    meta.textContent = (place.road_address_name || place.address_name || '') + (dist ? ' · ' + dist + 'km' : '');

    var hint = document.createElement('div');
    hint.className = 'place-hint';
    hint.textContent = '한 번 더 클릭 → 공연 정보 보기';

    info.appendChild(name);
    info.appendChild(meta);
    info.appendChild(hint);

    var favBtn = document.createElement('button');
    favBtn.className = 'fav-btn' + (favorites.has(place.id) ? ' active' : '');
    favBtn.textContent = favorites.has(place.id) ? '❤️' : '🤍';
    favBtn.onclick = function(e) { e.stopPropagation(); toggleFavorite(place, favBtn); };

    li.appendChild(icon);
    li.appendChild(info);
    li.appendChild(favBtn);
    li.onclick = function() { handlePlaceSelect(place, li); };
    list.appendChild(li);
  });
}

// ═══════════════════════════════════════════
//  NEARBY FOOD / CAFE
// ═══════════════════════════════════════════
function loadNearbyFood(place, category) {
  var list = document.getElementById('results');
  list.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div>주변 장소 불러오는 중…</div>';
  clearNearbyMarkers();

  var center = new kakao.maps.LatLng(place.y, place.x);
  ps.categorySearch(category, function(data, status) {
    if (status !== kakao.maps.services.Status.OK || data.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="emoji">😅</div>주변 장소를 찾지 못했어요</div>';
      return;
    }
    list.innerHTML = '';

    var label = category === 'CE7' ? '카페' : '맛집';
    var emoji = category === 'CE7' ? '☕' : '🍽';

    var sectionLabel = document.createElement('div');
    sectionLabel.style.cssText = 'padding:12px 16px 6px;font-size:12px;color:var(--text-muted);font-weight:600;';
    sectionLabel.textContent = '🎭 ' + place.place_name + ' 근처 ' + label;
    list.appendChild(sectionLabel);

    if (data.length > 1) {
      var bounds = new kakao.maps.LatLngBounds();
      bounds.extend(center);
      data.forEach(function(p) { bounds.extend(new kakao.maps.LatLng(p.y, p.x)); });
      map.setBounds(bounds);
    }

    data.slice(0, 12).forEach(function(p) {
      addNearbyMarker(p, true);
      var li = document.createElement('li');
      li.dataset.id = p.id;

      var icon = document.createElement('div');
      icon.className = 'place-icon';
      icon.textContent = emoji;

      var info = document.createElement('div');
      info.className = 'place-info';

      var name = document.createElement('div');
      name.className = 'place-name';
      name.textContent = p.place_name;

      var meta = document.createElement('div');
      meta.className = 'place-meta';
      var d2 = calcDistanceBetween(place, p);
      meta.textContent = (p.category_name ? p.category_name.split('>').pop().trim() : label) + (d2 ? ' · 극장에서 ' + d2 + 'km' : '');

      info.appendChild(name);
      info.appendChild(meta);

      li.appendChild(icon);
      li.appendChild(info);
      li.onclick = function() { handleFoodSelect(p, li); };
      list.appendChild(li);
    });
  }, { location: center, radius: 500, sort: kakao.maps.services.SortBy.DISTANCE });
}

function handleFoodSelect(place, liEl) {
  document.querySelectorAll('#results li').forEach(function(l) { l.classList.remove('selected'); });
  if (liEl) liEl.classList.add('selected');
  moveTo(place);
}

function moveTo(place) {
  clearSelectedMarker();
  var coords = new kakao.maps.LatLng(place.y, place.x);
  map.setCenter(coords);
  map.setLevel(3);
  selectedMarker = new kakao.maps.Marker({ position: coords, map: map, image: selectedMarkerImage, zIndex: 10 });
  selectedIW = new kakao.maps.InfoWindow({
    content: '<div style="padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap;color:#1a1a2e;">' + place.place_name + '</div>'
  });
  selectedIW.open(map, selectedMarker);
}

// ═══════════════════════════════════════════
//  PLACE SELECT (single = map move, double = detail)
// ═══════════════════════════════════════════
function handlePlaceSelect(place, liEl) {
  if (clickTimer && selectedPlaceId === place.id) {
    clearTimeout(clickTimer);
    clickTimer = null;
    selectedPlaceId = null;
    moveTo(place);
    showDetail(place);
  } else {
    if (clickTimer) clearTimeout(clickTimer);
    selectedPlaceId = place.id;
    selectedPlace = place;

    document.querySelectorAll('#results li').forEach(function(l) { l.classList.remove('selected'); });
    if (liEl) liEl.classList.add('selected');

    clickTimer = setTimeout(function() {
      clickTimer = null;
      selectedPlaceId = null;
      moveTo(place);
    }, 300);
  }
}

// ═══════════════════════════════════════════
//  DETAIL PANEL — Theater
// ═══════════════════════════════════════════
function showDetail(place) {
  var panel  = document.getElementById('detail-panel');
  var body   = document.getElementById('detail-body');

  document.getElementById('detail-title').textContent    = place.place_name;
  document.getElementById('detail-subtitle').textContent = place.category_name ? place.category_name.split('>').pop().trim() : '극장';

  // Clear & build theater info
  var content = document.getElementById('detail-content');
  content.innerHTML = '';

  var rows = [];
  if (place.address_name || place.road_address_name)
    rows.push({ icon:'🗺', text: place.road_address_name || place.address_name });
  if (place.phone) rows.push({ icon:'📞', text: place.phone });
  if (place.place_url) rows.push({ icon:'🔗', text: '<a href="' + place.place_url + '" target="_blank">카카오맵에서 보기</a>' });
  var dist = calcDistance(place);
  if (dist) rows.push({ icon:'📏', text: '현재 위치에서 약 ' + dist + 'km' });

  rows.forEach(function(r) {
    var row = document.createElement('div');
    row.className = 'detail-row';
    row.innerHTML = '<span class="detail-row-icon">' + r.icon + '</span><span class="detail-row-text">' + r.text + '</span>';
    content.appendChild(row);
  });

  // Show performance section, hide food section
  document.getElementById('perf-section').style.display  = 'block';
  document.getElementById('food-section').style.display  = 'none';

  panel.classList.add('open');
  fetchPerformances(place);
}

// ═══════════════════════════════════════════
//  FETCH PERFORMANCES via Claude API
// ═══════════════════════════════════════════
function fetchPerformances(place) {
  var loading = document.getElementById('perf-loading');
  var perfList = document.getElementById('perf-list');
  loading.style.display  = 'block';
  perfList.innerHTML     = '';

  var today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
  var prompt = [
    '당신은 한국 공연 정보 전문가입니다.',
    '오늘 날짜: ' + today,
    '극장명: ' + place.place_name,
    '주소: ' + (place.road_address_name || place.address_name || ''),
    '',
    '위 극장에서 현재 진행 중이거나 곧 시작하는 공연 정보를 JSON으로 반환해 주세요.',
    '형식:',
    '[',
    '  {',
    '    "title": "공연 제목",',
    '    "genre": "장르 (뮤지컬/연극/클래식/오페라/무용/복합 등)",',
    '    "period": "공연 기간 (예: 2025.05.01 ~ 2025.07.31)",',
    '    "price": "가격 (예: VIP 17만원 / R석 13만원 / S석 9만원)",',
    '    "keywords": ["키워드1","키워드2","키워드3"],',
    '    "description": "한두 줄 소개"',
    '  }',
    ']',
    '',
    '실제로 그 극장에서 공연 중인 작품을 우선 반환하세요.',
    '확실하지 않으면 그 극장의 대표 레퍼토리 스타일에 맞는 공연 예시를 realistic하게 반환하세요.',
    '공연이 없으면 빈 배열 [] 을 반환하세요.',
    '오직 JSON 배열만 반환하고, 다른 텍스트나 마크다운 코드블록은 절대 포함하지 마세요.'
  ].join('\n');

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }]
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    loading.style.display = 'none';
    var raw = (data.content || []).map(function(b) { return b.type === 'text' ? b.text : ''; }).join('');
    var clean = raw.replace(/```json|```/g, '').trim();
    var perfs;
    try { perfs = JSON.parse(clean); } catch(e) { perfs = []; }
    renderPerformances(perfs);
  })
  .catch(function() {
    loading.style.display = 'none';
    document.getElementById('perf-list').innerHTML =
      '<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">공연 정보를 불러오지 못했어요 😅</div>';
  });
}

function renderPerformances(perfs) {
  var perfList = document.getElementById('perf-list');
  perfList.innerHTML = '';
  if (!perfs || perfs.length === 0) {
    perfList.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">현재 공연 정보가 없습니다</div>';
    return;
  }
  perfs.forEach(function(p) {
    var card = document.createElement('div');
    card.className = 'perf-card';

    var title = document.createElement('div');
    title.className = 'perf-title';
    title.textContent = p.title || '–';

    var tags = document.createElement('div');
    tags.className = 'perf-tags';
    if (p.genre) {
      var genreTag = document.createElement('span');
      genreTag.className = 'perf-tag genre';
      genreTag.textContent = p.genre;
      tags.appendChild(genreTag);
    }
    (p.keywords || []).forEach(function(kw) {
      var t = document.createElement('span');
      t.className = 'perf-tag';
      t.textContent = kw;
      tags.appendChild(t);
    });

    var grid = document.createElement('div');
    grid.className = 'perf-meta-grid';

    function metaItem(label, value, cls) {
      var item = document.createElement('div');
      item.className = 'perf-meta-item';
      item.innerHTML = '<div class="perf-meta-label">' + label + '</div><div class="perf-meta-value ' + (cls||'') + '">' + (value||'–') + '</div>';
      return item;
    }

    grid.appendChild(metaItem('🗓 공연 기간', p.period));
    grid.appendChild(metaItem('🎟 가격', p.price, 'price'));

    card.appendChild(title);
    card.appendChild(tags);
    if (p.description) {
      var desc = document.createElement('div');
      desc.style.cssText = 'font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.5;';
      desc.textContent = p.description;
      card.appendChild(desc);
    }
    card.appendChild(grid);
    perfList.appendChild(card);
  });
}

// ═══════════════════════════════════════════
//  DETAIL CLOSE
// ═══════════════════════════════════════════
function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}
document.getElementById('detail-close').addEventListener('click', closeDetail);

// ═══════════════════════════════════════════
//  FAVORITES
// ═══════════════════════════════════════════
function toggleFavorite(place, btn) {
  if (favorites.has(place.id)) {
    favorites.delete(place.id);
    btn.textContent = '🤍'; btn.classList.remove('active');
  } else {
    favorites.set(place.id, place);
    btn.textContent = '❤️'; btn.classList.add('active');
  }
}

// ═══════════════════════════════════════════
//  DISTANCE
// ═══════════════════════════════════════════
function calcDistance(place) {
  if (!currentPosition) return null;
  return haversine(currentPosition.getLat(), currentPosition.getLng(), parseFloat(place.y), parseFloat(place.x));
}
function calcDistanceBetween(a, b) {
  return haversine(parseFloat(a.y), parseFloat(a.x), parseFloat(b.y), parseFloat(b.x));
}
function haversine(lat1, lon1, lat2, lon2) {
  var R = 6371, r = Math.PI/180;
  var dLat = (lat2-lat1)*r, dLon = (lon2-lon1)*r;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
}
