<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🎭 공연 지도</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── 팔레트 ── */
      --butter:    #FFF1B5;      /* Buttermilk — 배경, 카드 */
      --butter2:   #FDE98A;      /* 강조 버터 */
      --blue:      #C1DBE8;      /* Pastel Blue — 패널, 탭 */
      --blue2:     #9DC4D8;      /* 강조 블루 */
      --burg:      #43302E;      /* Old Burgundy — 텍스트, 액센트 */
      --burg-soft: rgba(67,48,46,0.08);
      --burg-mid:  rgba(67,48,46,0.18);

      --bg:        #EEF6FA;      /* 전체 배경 */
      --panel-bg:  #F7FBFD;      /* 패널 흰빛 */
      --panel-bg2: #E8F3F9;      /* 카드 내부 */
      --text:      #2C1E1C;      /* 본문 텍스트 */
      --text-sub:  #43302E;
      --text-muted:#7A6260;
      --border:    rgba(67,48,46,0.12);
      --hover:     rgba(193,219,232,0.45);
      --accent:    #43302E;
      --accent-lt: #C1DBE8;
      --gold:      #B07D2A;
      --radius:    14px;
      --shadow:    0 2px 20px rgba(67,48,46,0.08);
    }

    body {
      display: flex;
      height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      overflow: hidden;
      color: var(--text);
    }

    /* ── LEFT PANEL ── */
    #left-panel {
      width: 360px;
      min-width: 320px;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 10;
      position: relative;
    }

    /* Header */
    #header {
      padding: 20px 18px 14px;
      background: linear-gradient(160deg, var(--butter) 0%, var(--blue) 100%);
      border-bottom: 1px solid var(--border);
    }
    #header-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 19px;
      font-weight: 700;
      color: var(--burg);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 13px;
    }
    #header-title .logo-star {
      width: 28px; height: 28px;
    }

    #search-wrap { position: relative; }
    #search-box {
      width: 100%;
      padding: 10px 42px 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
      background: rgba(255,255,255,0.7);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    #search-box::placeholder { color: var(--text-muted); }
    #search-box:focus {
      border-color: var(--blue2);
      box-shadow: 0 0 0 3px rgba(193,219,232,0.5);
      background: #fff;
    }
    #search-btn {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--burg); display: flex; align-items: center;
    }
    #search-btn svg { width: 17px; height: 17px; }

    #suggestions {
      position: absolute;
      top: calc(100% + 4px); left: 0; right: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      max-height: 180px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(67,48,46,0.12);
      display: none;
    }
    #suggestions div {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: background .15s;
      border-bottom: 1px solid var(--border);
    }
    #suggestions div:last-child { border-bottom: none; }
    #suggestions div:hover { background: var(--hover); }

    /* Tabs */
    .tabs {
      display: flex;
      padding: 10px 12px;
      gap: 7px;
      border-bottom: 1px solid var(--border);
      background: var(--blue);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 7px 4px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid transparent;
      color: var(--burg);
      background: rgba(255,255,255,0.45);
      transition: all .2s;
      white-space: nowrap;
    }
    .tab:hover { background: rgba(255,255,255,0.7); border-color: var(--border); }
    .tab.active {
      background: var(--burg);
      color: var(--butter);
      border-color: var(--burg);
      box-shadow: 0 2px 8px rgba(67,48,46,0.2);
    }

    /* Results */
    #results-area {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--blue2) transparent;
    }
    #results { list-style: none; }
    #results li {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background .15s;
    }
    #results li:hover { background: var(--hover); }
    #results li.selected {
      background: rgba(193,219,232,0.3);
      border-left: 3px solid var(--burg);
    }

    .place-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--butter);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .place-icon img { width: 26px; height: 26px; object-fit: contain; }
    .place-info { flex: 1; min-width: 0; }
    .place-name {
      font-size: 13.5px; font-weight: 600;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .place-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .place-hint {
      font-size: 10.5px; color: var(--blue2);
      margin-top: 2px; font-weight: 500;
    }

    .fav-btn {
      background: none; border: none;
      cursor: pointer; font-size: 16px;
      flex-shrink: 0; opacity: .5;
      transition: opacity .2s, transform .2s;
      padding: 4px;
    }
    .fav-btn:hover { opacity: 1; transform: scale(1.2); }
    .fav-btn.active { opacity: 1; }

    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.8;
    }
    .empty-state .emoji { font-size: 36px; margin-bottom: 10px; }

    /* ── DETAIL PANEL ── */
    #detail-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--panel-bg);
      border-top: 3px solid var(--burg);
      border-radius: var(--radius) var(--radius) 0 0;
      transform: translateY(100%);
      transition: transform .36s cubic-bezier(.4,0,.2,1);
      z-index: 30;
      max-height: 82%;
      overflow-y: auto;
      box-shadow: 0 -8px 32px rgba(67,48,46,0.13);
    }
    #detail-panel.open { transform: translateY(0); }

    #detail-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 16px 11px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: linear-gradient(135deg, var(--butter) 0%, #fff 100%);
      z-index: 1;
    }
    #detail-header-left { display: flex; flex-direction: column; gap: 3px; }
    #detail-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 15px; font-weight: 700;
      color: var(--burg);
    }
    #detail-subtitle { font-size: 11px; color: var(--text-muted); }
    #detail-close {
      background: var(--burg-soft); border: none; cursor: pointer;
      color: var(--burg); font-size: 18px; line-height: 1;
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    #detail-close:hover { background: var(--burg-mid); }

    #detail-body { padding: 14px 16px 20px; }

    .detail-row {
      display: flex; align-items: flex-start;
      gap: 10px; margin-bottom: 10px; font-size: 13px;
    }
    .detail-row-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
    .detail-row-text { color: var(--text-muted); line-height: 1.5; }
    .detail-row-text a { color: var(--burg); text-decoration: none; font-weight: 500; }
    .detail-row-text a:hover { text-decoration: underline; }

    /* Performance section */
    #perf-section { margin-top: 16px; }
    .section-title {
      font-size: 12px; font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Performance cards */
    .perf-card {
      background: var(--butter);
      border: 1px solid rgba(67,48,46,0.1);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      transition: box-shadow .2s, border-color .2s;
    }
    .perf-card:hover {
      box-shadow: 0 4px 166px rgba(67,48,46,0.1);
      border-color: var(--burg);
    }
    .perf-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 14px; font-weight: 700;
      color: var(--burg);
      margin-bottom: 8px; line-height: 1.4;
    }
    .perf-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .perf-tag {
      padding: 2px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 500;
      background: var(--blue);
      color: var(--burg);
      border: 1px solid rgba(67,48,46,0.12);
    }
    .perf-tag.genre {
      background: var(--burg);
      color: var(--butter);
      border-color: var(--burg);
    }
    .perf-desc {
      font-size: 12px; color: var(--text-muted);
      margin-bottom: 10px; line-height: 1.6;
    }
    .perf-meta-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .perf-meta-item {
      background: rgba(255,255,255,0.6);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px;
    }
    .perf-meta-label { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
    .perf-meta-value { font-size: 12px; font-weight: 600; color: var(--text); }
    .perf-meta-value.price { color: var(--gold); }

    #food-section { margin-top: 4px; }

    #map { flex: 1; }
  </style>
</head>
<body>
<div id="left-panel">

  <div id="header">
    <div id="header-title">
      <img class="logo-star" src="/mnt/user-data/uploads/ʕっ_____ʔㅤㅤ_ㅤ_𓈒_ㅤ𝖼_𝗈_ttf_𝗈_𝗇_ㅤ_𝗉_𝗈_𝗌_tㅤ_𓈒ㅤ__.webp" alt="">
      공연 지도
    </div>
    <div id="search-wrap">
      <input type="text" id="search-box" placeholder="극장 이름으로 검색…">
      <button id="search-btn" title="검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <div id="suggestions"></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-type="theater">🎭 극장</div>
    <div class="tab" data-type="food">🍽 맛집</div>
    <div class="tab" data-type="cafe">☕ 카페</div>
  </div>

  <div id="results-area">
    <ul id="results"></ul>
  </div>

  <div id="detail-panel">
    <div id="detail-header">
      <div id="detail-header-left">
        <div id="detail-title"></div>
        <div id="detail-subtitle"></div>
      </div>
      <button id="detail-close">×</button>
    </div>
    <div id="detail-body">
      <div id="detail-content"></div>
      <div id="perf-section" style="display:none;">
        <div class="section-title">🎬 현재 공연 중</div>
        <div id="perf-list"></div>
      </div>
      <div id="food-section" style="display:none;">
        <div class="section-title">📍 극장 주변</div>
        <div id="food-list"></div>
      </div>
    </div>
  </div>
</div>

<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5bf7c0ceaa203771db8251bd28f75cac&libraries=services"></script>
<script>
// ═══════════════════════════════════════════
//  MAP INIT
// ═══════════════════════════════════════════
var mapContainer = document.getElementById('map');
var map = new kakao.maps.Map(mapContainer, {
  center: new kakao.maps.LatLng(37.566826, 126.978656),
  level: 5
});
var ps = new kakao.maps.services.Places();

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
var currentPosition = null;
var selectedMarker   = null;
var selectedIW       = null;
var nearbyMarkers    = [];
var favorites        = new Map();
var activeType       = 'theater';
var selectedPlace    = null;
var clickTimer       = null;
var selectedPlaceId  = null;

// ═══════════════════════════════════════════
//  MARKER IMAGES
// ═══════════════════════════════════════════
function makeSVGUrl(svg) {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// 선택 마커: 보라 핀
var selSVG = [
  '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44">',
  '<defs><filter id="ds"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.45"/></filter></defs>',
  '<g filter="url(#ds)">',
  '<path d="M17 2C9.82 2 4 7.82 4 15c0 10 13 27 13 27S30 25 30 15C30 7.82 24.18 2 17 2z" fill="#a855f7"/>',
  '<circle cx="17" cy="15" r="7" fill="#fff"/>',
  '<text x="17" y="19" text-anchor="middle" font-size="10" fill="#a855f7">🎭</text>',
  '</g></svg>'
].join('');
var selectedMarkerImage = new kakao.maps.MarkerImage(
  makeSVGUrl(selSVG),
  new kakao.maps.Size(34, 44),
  { offset: new kakao.maps.Point(17, 44) }
);

// 목록 마커: 작은 보라 동그라미
var dotSVG = [
  '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">',
  '<circle cx="7" cy="7" r="6" fill="#c084fc" stroke="#fff" stroke-width="2"/>',
  '</svg>'
].join('');
var nearbyMarkerImage = new kakao.maps.MarkerImage(
  makeSVGUrl(dotSVG),
  new kakao.maps.Size(14, 14),
  { offset: new kakao.maps.Point(7, 7) }
);

// 음식/카페 마커: 작은 골드 동그라미
var foodDotSVG = [
  '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">',
  '<circle cx="7" cy="7" r="6" fill="#fbbf24" stroke="#fff" stroke-width="2"/>',
  '</svg>'
].join('');
var foodMarkerImage = new kakao.maps.MarkerImage(
  makeSVGUrl(foodDotSVG),
  new kakao.maps.Size(14, 14),
  { offset: new kakao.maps.Point(7, 7) }
);

// ═══════════════════════════════════════════
//  MARKER HELPERS
// ═══════════════════════════════════════════
function clearSelectedMarker() {
  if (selectedMarker) { selectedMarker.setMap(null); selectedMarker = null; }
  if (selectedIW)     { selectedIW.close();           selectedIW = null;     }
}
function clearNearbyMarkers() {
  nearbyMarkers.forEach(function(m) { m.setMap(null); });
  nearbyMarkers = [];
}
// 💡 수정 포인트: 맛집/카페 이동 시 '선택된 극장 마커'는 지우지 않는 새로운 클리어 함수
function clearMarkersForTabChange() {
  clearNearbyMarkers();
  // 만약 선택된 극장(selectedPlace)이 없다면 선택 마커도 함께 초기화합니다.
  if (!selectedPlace) {
    clearSelectedMarker();
  }
}

function addNearbyMarker(place, isFood) {
  var coords = new kakao.maps.LatLng(place.y, place.x);
  var marker = new kakao.maps.Marker({
    position: coords,
    map: map,
    image: isFood ? foodMarkerImage : nearbyMarkerImage
  });
  nearbyMarkers.push(marker);
  kakao.maps.event.addListener(marker, 'click', function() {
    if (isFood) {
      highlightListItem(place.id);
      moveTo(place);
    } else {
      highlightListItem(place.id);
      moveTo(place);
      selectedPlace = place;
      if (activeType === 'theater') showDetail(place);
    }
  });
  return marker;
}

function highlightListItem(placeId) {
  document.querySelectorAll('#results li').forEach(function(l) { l.classList.remove('selected'); });
  var target = document.querySelector('#results li[data-id="' + placeId + '"]');
  if (target) {
    target.classList.add('selected');
    target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ═══════════════════════════════════════════
//  GEOLOCATION
// ═══════════════════════════════════════════
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(function(pos) {
    currentPosition = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
    map.setCenter(currentPosition);
    var mySVG = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#a855f7" opacity="0.18"/><circle cx="10" cy="10" r="5.5" fill="#a855f7" stroke="#fff" stroke-width="2"/></svg>';
    new kakao.maps.Marker({
      position: currentPosition, map: map,
      image: new kakao.maps.MarkerImage(makeSVGUrl(mySVG), new kakao.maps.Size(20,20), { offset: new kakao.maps.Point(10,10) })
    });
    loadTab('theater');
  }, function() { loadTab('theater'); });
} else {
  loadTab('theater');
}

// ═══════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════
var searchBox   = document.getElementById('search-box');
var suggestions = document.getElementById('suggestions');
var suggestTimer = null;

searchBox.addEventListener('input', function() {
  var kw = searchBox.value.trim();
  if (!kw) { suggestions.style.display = 'none'; return; }

  clearTimeout(suggestTimer);
  suggestTimer = setTimeout(function() {
    ps.keywordSearch(kw, function(data, status) {
      var results = (status === kakao.maps.services.Status.OK) ? data : [];
      if (results.length === 0) {
        ps.keywordSearch(kw, function(d2, s2) {
          showSuggestions((s2 === kakao.maps.services.Status.OK) ? d2 : []);
        }, { location: new kakao.maps.LatLng(37.5665, 126.9780), radius: 20000 });
      } else {
        showSuggestions(results);
      }
    }, currentPosition ? { location: currentPosition, radius: 20000 } : {});
  }, 200);
});

function showSuggestions(data) {
  suggestions.innerHTML = '';
  if (!data || data.length === 0) { suggestions.style.display = 'none'; return; }
  data.slice(0, 6).forEach(function(p) {
    var d = document.createElement('div');
    var cat = p.category_group_name || (p.category_name ? p.category_name.split('>').pop().trim() : '');
    d.innerHTML = '<span style="font-weight:500">' + p.place_name + '</span>' +
      (cat ? '<span style="color:var(--text-muted);font-size:11px;margin-left:6px;">' + cat + '</span>' : '');
    d.onclick = function() {
      searchBox.value = p.place_name;
      suggestions.style.display = 'none';
      searchByKeyword(p.place_name);
    };
    suggestions.appendChild(d);
  });
  suggestions.style.display = 'block';
}

searchBox.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { suggestions.style.display = 'none'; searchByKeyword(searchBox.value.trim()); }
  if (e.key === 'Escape') { suggestions.style.display = 'none'; }
});
document.getElementById('search-btn').addEventListener('click', function() {
  suggestions.style.display = 'none';
  searchByKeyword(searchBox.value.trim());
});
document.addEventListener('click', function(e) {
  if (!e.target.closest('#search-wrap')) suggestions.style.display = 'none';
});

function searchByKeyword(kw) {
  if (!kw) return;
  // 검색 시에는 전체 마커 초기화
  clearSelectedMarker();
  clearNearbyMarkers();
  document.getElementById('results').innerHTML = '<div class="empty-state"><div class="emoji">🔍</div>검색 중…</div>';

  var opts = currentPosition
    ? { location: currentPosition, radius: 20000 }
    : { location: new kakao.maps.LatLng(37.5665, 126.9780), radius: 30000 };

  ps.keywordSearch(kw, function(data, status) {
    if (status === kakao.maps.services.Status.OK && data.length > 0) {
      displayTheaters(data);
    } else {
      ps.keywordSearch(kw, function(d2, s2) {
        displayTheaters(s2 === kakao.maps.services.Status.OK ? d2 : []);
      });
    }
  }, opts);
}

// ═══════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    activeType = tab.getAttribute('data-type');
    closeDetail();
    
    // 💡 수정 포인트: 탭 전환 시 극장 마커 유지를 위해 마커 클리어 함수 교체
    clearMarkersForTabChange();
    loadTab(activeType);
  });
});

function loadTab(type) {
  activeType = type;
  if (type === 'theater') {
    searchTheaters();
  } else if (type === 'food') {
    if (selectedPlace) {
      loadNearbyFood(selectedPlace, 'FD6');
    } else {
      showNearbyInstruction('식당');
    }
  } else if (type === 'cafe') {
    if (selectedPlace) {
      loadNearbyFood(selectedPlace, 'CE7');
    } else {
      showNearbyInstruction('카페');
    }
  }
}

function showNearbyInstruction(label) {
  clearNearbyMarkers();
  document.getElementById('results').innerHTML =
    '<div class="empty-state"><div class="emoji">🎭</div>극장 탭에서 극장을 먼저 선택하면<br>주변 ' + label + '을 보여드려요!</div>';
}

// ═══════════════════════════════════════════
//  THEATER SEARCH
// ═══════════════════════════════════════════
var THEATER_KEYWORDS = [
  '세종문화회관', '충무아트센터', '예술의전당', '국립극장',
  '링크아트센터', 'LG아트센터', '블루스퀘어',
  '홍익대학교대학로아트센터', '대학로예술극장', '명동예술극장',
  'KBS아트홀', '국립정동극장', '두산아트센터', '아르코예술극장',
  '디큐브아트센터', '샤롯데씨어터', '드림아트센터', '더굿씨어터'
];

function searchTheaters() {
  var list = document.getElementById('results');
  list.innerHTML = '<div class="empty-state"><div class="emoji">🎭</div>극장 목록 불러오는 중…</div>';
  clearNearbyMarkers();

  var center = currentPosition || new kakao.maps.LatLng(37.5665, 126.9780);
  var allPlaces = [];
  var idSet = new Set();
  var done = 0;
  var total = THEATER_KEYWORDS.length;

  THEATER_KEYWORDS.forEach(function(kw) {
    ps.keywordSearch(kw, function(data, status) {
      done++;
      if (status === kakao.maps.services.Status.OK) {
        data.slice(0, 2).forEach(function(p) {
          if (!idSet.has(p.id)) {
            idSet.add(p.id);
            allPlaces.push(p);
          }
        });
      }
      if (done === total) {
        allPlaces.sort(function(a, b) {
          return parseFloat(haversine(center.getLat(), center.getLng(), a.y, a.x))
               - parseFloat(haversine(center.getLat(), center.getLng(), b.y, b.x));
        });
        displayTheaters(allPlaces.length > 0 ? allPlaces : []);
      }
    }, { location: new kakao.maps.LatLng(37.5665, 126.9780), radius: 50000 });
  });
}

function displayTheaters(places) {
  clearNearbyMarkers();
  var list = document.getElementById('results');
  list.innerHTML = '';

  if (!places || places.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">🎭</div>근처 극장을 찾지 못했어요<br><small>검색창에서 극장 이름을 검색해보세요</small></div>';
    return;
  }

  // 💡 수정 포인트: 만약 이미 선택된 극장이 있다면 bounds 포함 범위에서 유지하거나 목록 바이어스 처리
  if (places.length > 1) {
    var bounds = new kakao.maps.LatLngBounds();
    places.forEach(function(p) { bounds.extend(new kakao.maps.LatLng(p.y, p.x)); });
    map.setBounds(bounds);
  }

  places.forEach(function(place) {
    // 이미 지도 중심핀으로 잡혀있는 극장이 아니라면 보조 마커를 뿌려줍니다.
    if (!selectedPlace || selectedPlace.id !== place.id) {
      addNearbyMarker(place, false);
    }

    var li = document.createElement('li');
    li.dataset.id = place.id;
    if (selectedPlace && selectedPlace.id === place.id) {
      li.className = 'selected';
    }

    var icon = document.createElement('div');
    icon.className = 'place-icon';
    icon.textContent = '🎭';

    var info = document.createElement('div');
    info.className = 'place-info';

    var name = document.createElement('div');
    name.className = 'place-name';
    name.textContent = place.place_name;

    var meta = document.createElement('div');
    meta.className = 'place-meta';
    var dist = calcDistance(place);
    meta.textContent = (place.road_address_name || place.address_name || '') + (dist ? ' · ' + dist + 'km' : '');

    var hint = document.createElement('div');
    hint.className = 'place-hint';
    hint.textContent = '클릭하면 공연 정보 바로 보기 →';

    info.appendChild(name);
    info.appendChild(meta);
    info.appendChild(hint);

    var favBtn = document.createElement('button');
    favBtn.className = 'fav-btn' + (favorites.has(place.id) ? ' active' : '');
    favBtn.textContent = favorites.has(place.id) ? '❤️' : '🤍';
    favBtn.onclick = function(e) { e.stopPropagation(); toggleFavorite(place, favBtn); };

    li.appendChild(icon);
    li.appendChild(info);
    li.appendChild(favBtn);
    li.onclick = function() { handlePlaceSelect(place, li); };
    list.appendChild(li);
  });
}

// ═══════════════════════════════════════════
//  NEARBY FOOD / CAFE
// ═══════════════════════════════════════════
function loadNearbyFood(place, category) {
  var list = document.getElementById('results');
  list.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div>주변 장소 불러오는 중…</div>';
  clearNearbyMarkers();

  var center = new kakao.maps.LatLng(place.y, place.x);
  ps.categorySearch(category, function(data, status) {
    if (status !== kakao.maps.services.Status.OK || data.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="emoji">😅</div>주변 장소를 찾지 못했어요</div>';
      return;
    }
    list.innerHTML = '';

    var label = category === 'CE7' ? '카페' : '맛집';
    var emoji = category === 'CE7' ? '☕' : '🍽';

    var sectionLabel = document.createElement('div');
    sectionLabel.style.cssText = 'padding:12px 16px 6px;font-size:12px;color:var(--text-muted);font-weight:600;';
    sectionLabel.textContent = '🎭 ' + place.place_name + ' 근처 ' + label;
    list.appendChild(sectionLabel);

    if (data.length > 1) {
      var bounds = new kakao.maps.LatLngBounds();
      bounds.extend(center);
      data.forEach(function(p) { bounds.extend(new kakao.maps.LatLng(p.y, p.x)); });
      map.setBounds(bounds);
    }

    data.slice(0, 12).forEach(function(p) {
      addNearbyMarker(p, true);
      var li = document.createElement('li');
      li.dataset.id = p.id;

      var icon = document.createElement('div');
      icon.className = 'place-icon';
      icon.textContent = emoji;

      var info = document.createElement('div');
      info.className = 'place-info';

      var name = document.createElement('div');
      name.className = 'place-name';
      name.textContent = p.place_name;

      var meta = document.createElement('div');
      meta.className = 'place-meta';
      var d2 = calcDistanceBetween(place, p);
      meta.textContent = (p.category_name ? p.category_name.split('>').pop().trim() : label) + (d2 ? ' · 극장에서 ' + d2 + 'km' : '');

      info.appendChild(name);
      info.appendChild(meta);

      li.appendChild(icon);
      li.appendChild(info);
      li.onclick = function() { handleFoodSelect(p, li); };
      list.appendChild(li);
    });
  }, { location: center, radius: 500, sort: kakao.maps.services.SortBy.DISTANCE });
}

function handleFoodSelect(place, liEl) {
  document.querySelectorAll('#results li').forEach(function(l) { l.classList.remove('selected'); });
  if (liEl) liEl.classList.add('selected');
  
  // 💡 맛집 선택 시 해당 좌표로 맵 이동 및 마커 세팅을 하되 극장 마커 유지를 보장하기 위해 분리 적용
  var coords = new kakao.maps.LatLng(place.y, place.x);
  map.setCenter(coords);
  map.setLevel(2);
}

function moveTo(place) {
  clearSelectedMarker();
  var coords = new kakao.maps.LatLng(place.y, place.x);
  map.setCenter(coords);
  map.setLevel(3);
  selectedMarker = new kakao.maps.Marker({ position: coords, map: map, image: selectedMarkerImage, zIndex: 10 });
  selectedIW = new kakao.maps.InfoWindow({
    content: '<div style="padding:5px 10px;font-size:13px;font-weight:600;white-space:nowrap;color:#1a1a2e;">' + place.place_name + '</div>'
  });
  selectedIW.open(map, selectedMarker);
}

// ═══════════════════════════════════════════
//  PLACE SELECT
// ═══════════════════════════════════════════
function handlePlaceSelect(place, liEl) {
  selectedPlace = place;
  highlightListItem(place.id);
  moveTo(place);
  if (activeType === 'theater') showDetail(place);
}

// ═══════════════════════════════════════════
//  DETAIL PANEL — Theater
// ═══════════════════════════════════════════
function showDetail(place) {
  var panel  = document.getElementById('detail-panel');
  var body   = document.getElementById('detail-body');

  document.getElementById('detail-title').textContent    = place.place_name;
  document.getElementById('detail-subtitle').textContent = place.category_name ? place.category_name.split('>').pop().trim() : '극장';

  var content = document.getElementById('detail-content');
  content.innerHTML = '';

  var rows = [];
  if (place.address_name || place.road_address_name)
    rows.push({ icon:'🗺', text: place.road_address_name || place.address_name });
  if (place.phone) rows.push({ icon:'📞', text: place.phone });
  if (place.place_url) rows.push({ icon:'🔗', text: '<a href="' + place.place_url + '" target="_blank">카카오맵에서 보기</a>' });
  var dist = calcDistance(place);
  if (dist) rows.push({ icon:'📏', text: '현재 위치에서 약 ' + dist + 'km' });

  rows.forEach(function(r) {
    var row = document.createElement('div');
    row.className = 'detail-row';
    row.innerHTML = '<span class="detail-row-icon">' + r.icon + '</span><span class="detail-row-text">' + r.text + '</span>';
    content.appendChild(row);
  });

  document.getElementById('perf-section').style.display  = 'block';
  document.getElementById('food-section').style.display  = 'none';

  panel.classList.add('open');
  fetchPerformances(place);
}

// ═══════════════════════════════════════════
//  PERFORMANCE API INTEGRATION (KOPIS 실시간 연동)
// ═══════════════════════════════════════════

// 발급받으신 KOPIS API 서비스키 적용
var KOPIS_API_KEY = "9cf84762ca7742f29898ee247497ea2f"; 

async function fetchPerformances(place) {
  var perfList = document.getElementById('perf-list');
  perfList.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:12px 0;">🔄 KOPIS에서 실시간 공연 정보 받아오는 중…</div>';

  try {
    // 1. CORS 에러 우회를 위한 프록시 주소 결합
    var proxyUrl = "https://cors-anywhere.herokuapp.com/"; 
    
    // 2. 극장 명칭으로 KOPIS 공연시설 코드(mt10id) 조회 API 주소 생성
    var facilityUrl = "http://www.kopis.or.kr/openApi/restful/prfplc?service=" + KOPIS_API_KEY + "&shprfnm=" + encodeURIComponent(place.place_name);
    
    var facResponse = await fetch(proxyUrl + facilityUrl);
    var facXmlText = await facResponse.text();
    
    // XML 파싱
    var parser = new DOMParser();
    var xmlDoc = parser.parseFromString(facXmlText, "text/xml");
    var mt10idNode = xmlDoc.querySelector("mt10id");
    
    // 시설 코드가 없다면 검색 키워드를 단축해서 재검색 시도 (예: 세종문화회관 대극장 -> 세종문화회관)
    if (!mt10idNode) {
      var shortName = place.place_name.split(' ')[0];
      facilityUrl = "http://www.kopis.or.kr/openApi/restful/prfplc?service=" + KOPIS_API_KEY + "&shprfnm=" + encodeURIComponent(shortName);
      facResponse = await fetch(proxyUrl + facilityUrl);
      facXmlText = await facResponse.text();
      xmlDoc = parser.parseFromString(facXmlText, "text/xml");
      mt10idNode = xmlDoc.querySelector("mt10id");
    }

    if (!mt10idNode) {
      showNoPerformanceMessage(place.place_name);
      return;
    }
    
    var facilityCode = mt10idNode.textContent;

    // 3. 현재 날짜 기준 전후 2달 범위로 상연 중인 공연 목록 요청 변수 세팅
    var today = new Date();
    var priorDate = new Date(new Date().setMonth(today.getMonth() - 1));
    var futureDate = new Date(new Date().setMonth(today.getMonth() + 2));
    
    var formatDate = function(date) {
      return date.toISOString().slice(0,10).replace(/-/g, "");
    };
    
    var stdate = formatDate(priorDate); // 1달 전부터
    var eddate = formatDate(futureDate); // 2달 후까지

    // 4. 해당 극장의 공연 목록 조회 API 호출
    var prfUrl = "http://www.kopis.or.kr/openApi/restful/pblprfr?service=" + KOPIS_API_KEY + "&stdate=" + stdate + "&eddate=" + eddate + "&shplcids=" + facilityCode;
    
    var prfResponse = await fetch(proxyUrl + prfUrl);
    var prfXmlText = await prfResponse.text();
    var prfXml = parser.parseFromString(prfXmlText, "text/xml");
    var prfNodes = prfXml.querySelectorAll("db");

    if (prfNodes.length === 0) {
      showNoPerformanceMessage(place.place_name);
      return;
    }

    // 5. 받아온 실시간 XML 데이터를 배열로 변환
    var parsedPerformances = [];
    prfNodes.forEach(function(node) {
      parsedPerformances.push({
        title: node.querySelector("prfnm")?.textContent || "공연명 없음",
        genre: node.querySelector("genrn")?.textContent || "공연",
        period: (node.querySelector("prfast")?.textContent || node.querySelector("prfstdate")?.textContent || "") + " ~ " + (node.querySelector("prfae")?.textContent || node.querySelector("prfeddate")?.textContent || ""),
        price: "상세내역 참조",
        keywords: [node.querySelector("fcltynm")?.textContent || "공연장"],
        description: "현재 이 극장에서 상연 중이거나 예정된 실시간 등록 공연입니다."
      });
    });

    // 화면에 그리기
    renderPerformances(parsedPerformances);

  } catch (error) {
    console.error("공연 정보 API 호출 실패:", error);
    perfList.innerHTML = 
      '<div style="color:var(--text-muted);font-size:12px;padding:16px 0;line-height:1.8;">' +
      '❌ 실시간 데이터를 가져오는 중 오류가 발생했습니다.<br>' +
      '<span style="font-size:11px; color:var(--gold);">[팁] 하단의 프록시 활성화 버튼을 누르셨는지 확인해 주세요.</span>' +
      '</div>';
  }
}

function showNoPerformanceMessage(placeName) {
  var perfList = document.getElementById('perf-list');
  perfList.innerHTML =
    '<div style="color:var(--text-muted);font-size:13px;padding:16px 0;line-height:1.8;">' +
    '📋 <strong style="color:var(--text);">' + placeName + '</strong>의<br>' +
    '현재 상연 중인 실시간 일정을 찾지 못했습니다.<br>' +
    '<span style="font-size:12px; display:inline-block; margin-top:5px; color:var(--blue2);">축제/대관 양식에 따라 조회가 안 될 수 있습니다.</span>' +
    '</div>';
}

function renderPerformances(perfs) {
  var perfList = document.getElementById('perf-list');
  perfList.innerHTML = '';
  
  perfs.slice(0, 3).forEach(function(p) { // 최대 3개까지만 출력하도록 제한
    var card = document.createElement('div');
    card.className = 'perf-card';

    var title = document.createElement('div');
    title.className = 'perf-title';
    title.textContent = p.title;

    var tags = document.createElement('div');
    tags.className = 'perf-tags';
    if (p.genre) {
      var genreTag = document.createElement('span');
      genreTag.className = 'perf-tag genre';
      genreTag.textContent = p.genre;
      tags.appendChild(genreTag);
    }
    (p.keywords || []).forEach(function(kw) {
      var t = document.createElement('span');
      t.className = 'perf-tag';
      t.textContent = kw;
      tags.appendChild(t);
    });

    var grid = document.createElement('div');
    grid.className = 'perf-meta-grid';

    function metaItem(label, value, cls) {
      var item = document.createElement('div');
      item.className = 'perf-meta-item';
      item.innerHTML = '<div class="perf-meta-label">' + label + '</div><div class="perf-meta-value ' + (cls||'') + '">' + (value||'–') + '</div>';
      return item;
    }

    grid.appendChild(metaItem('🗓 공연 기간', p.period));
    grid.appendChild(metaItem('🎟 예매처', 'KOPIS 연동 중', 'price'));

    card.appendChild(title);
    card.appendChild(tags);
    if (p.description) {
      var desc = document.createElement('div');
      desc.style.cssText = 'font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.5;';
      desc.textContent = p.description;
      card.appendChild(desc);
    }
    card.appendChild(grid);
    perfList.appendChild(card);
  });
}

// ═══════════════════════════════════════════

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}
document.getElementById('detail-close').addEventListener('click', closeDetail);

// ═══════════════════════════════════════════
//  FAVORITES
// ═══════════════════════════════════════════
function toggleFavorite(place, btn) {
  if (favorites.has(place.id)) {
    favorites.delete(place.id);
    btn.textContent = '🤍'; btn.classList.remove('active');
  } else {
    favorites.set(place.id, place);
    btn.textContent = '❤️'; btn.classList.add('active');
  }
}

// ═══════════════════════════════════════════
//  DISTANCE
// ═══════════════════════════════════════════
function calcDistance(place) {
  if (!currentPosition) return null;
  return haversine(currentPosition.getLat(), currentPosition.getLng(), parseFloat(place.y), parseFloat(place.x));
}
function calcDistanceBetween(a, b) {
  return haversine(parseFloat(a.y), parseFloat(a.x), parseFloat(b.y), parseFloat(b.x));
}
function haversine(lat1, lon1, lat2, lon2) {
  var R = 6371, r = Math.PI/180;
  var dLat = (lat2-lat1)*r, dLon = (lon2-lon1)*r;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
}
