<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Kakao Map Search Service</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    #left-panel {
      width: 30%;
      padding: 20px;
      box-sizing: border-box;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }
    #search-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #results {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #results li {
      padding: 8px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    #results li:hover {
      background-color: #f0f0f0;
    }
    #map {
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="left-panel">
    <input type="text" id="search-box" placeholder="장소를 입력하세요">
    <ul id="results"></ul>
  </div>
  <div id="map"></div>

  <!-- 카카오맵 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5bf7c0ceaa203771db8251bd28f75cac&libraries=services"></script>
  <script>
    var mapContainer = document.getElementById('map');
    var mapOption = {
      center: new kakao.maps.LatLng(37.66, 126.83), // 기본 좌표
      level: 5
    };
    var map = new kakao.maps.Map(mapContainer, mapOption);

    // 현재 위치 가져오기 (브라우저 권한 요청)
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        var lat = position.coords.latitude;   // 위도
        var lon = position.coords.longitude;  // 경도
        var locPosition = new kakao.maps.LatLng(lat, lon);

        // 지도 중심을 내 위치로 이동
        map.setCenter(locPosition);

        // 내 위치 마커 표시
        var currentMarker = new kakao.maps.Marker({
          position: locPosition,
          map: map
        });

        var infowindow = new kakao.maps.InfoWindow({
          content: '<div style="padding:5px;font-size:12px;">내 위치</div>'
        });
        infowindow.open(map, currentMarker);
      }, function(error) {
        alert('위치 정보를 가져올 수 없습니다. 기본 좌표로 표시합니다.');
      });
    } else {
      alert('이 브라우저에서는 위치 정보를 지원하지 않습니다.');
    }

    // 장소 검색 객체
    var ps = new kakao.maps.services.Places();

    document.getElementById('search-box').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        searchPlaces();
      }
    });

    function searchPlaces() {
      var keyword = document.getElementById('search-box').value;
      if (!keyword.trim()) {
        alert('검색어를 입력하세요!');
        return;
      }
      ps.keywordSearch(keyword, placesSearchCB);
    }

    function placesSearchCB(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        displayPlaces(data);
      } else {
        alert('검색 결과가 없습니다.');
      }
    }

    function displayPlaces(places) {
      var resultsList = document.getElementById('results');
      resultsList.innerHTML = '';

      places.forEach(function(place) {
        var li = document.createElement('li');
        li.textContent = place.place_name;
        li.onclick = function() {
          moveToPlace(place);
        };
        resultsList.appendChild(li);
      });
    }

    function moveToPlace(place) {
      var coords = new kakao.maps.LatLng(place.y, place.x);
      map.setCenter(coords);

      var marker = new kakao.maps.Marker({
        position: coords,
        map: map
      });

      var infowindow = new kakao.maps.InfoWindow({
        content: '<div style="padding:5px;font-size:12px;">' + place.place_name + '</div>'
      });
      infowindow.open(map, marker);
    }
  </script>
</body>
</html>
